plugins {
    id 'com.android.application'
}

android {
    namespace 'com.talkingrobot.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.talkingrobot.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // لا تفعّل shrinkResources/minify قبل ما تتأكد WebView + JS Bridge يشتغلون زين بعدها
        }
        debug {
            debuggable true
        }
    }

    // الواجهة كلها JS/HTML داخل assets/index.html، ما نحتاج compose ولا viewBinding
    buildFeatures {
        viewBinding false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
}
