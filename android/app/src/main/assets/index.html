<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080c10">
<title>الروبوت المتكلّم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600&display=swap">
<style>
/* Layout: a fixed one-screen robot app. Status strip, a compact face on a night stage (camera eye beside it),
   the conversation as a chat that scrolls only vertically, suggestion chips, and the ask bar. Settings open
   as a separate full screen. Nothing on the page can be dragged sideways or zoomed. */
:root{
  --bg:#080c10; --panel:#0f161c; --raised:#17212a; --line:#23313c; --fg:#e8eef1; --muted:#8797a2;
  --glow:#5ff2ea; --glow-rgb:95,242,234; --glow-core:#d4fffb; --mouth:#05090d; --on-glow:#03201f; --warn:#ffb547;
  --glow-haze:rgba(var(--glow-rgb),.09); --glow-haze-2:rgba(var(--glow-rgb),.025); --ring:rgba(var(--glow-rgb),.11);
  --glow-shadow:rgba(var(--glow-rgb),.6); --glow-line:rgba(var(--glow-rgb),.45); --glow-soft:rgba(var(--glow-rgb),.12);
  --warn-shadow:rgba(255,181,71,.65); --warn-line:rgba(255,181,71,.45); --shade:rgba(0,0,0,.55); --veil:rgba(8,12,16,.62);
  --user:#14303a;
  --font-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --font-body:"IBM Plex Sans Arabic","Readex Pro",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --face:min(25vh,54vw); --fs:1;
  color-scheme:dark;
}
:root[data-face=s]{--face:min(20vh,44vw)}
:root[data-face=l]{--face:min(31vh,64vw)}
:root[data-text=s]{--fs:.92} :root[data-text=l]{--fs:1.12}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{position:fixed;inset:0;width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:calc(15px * var(--fs));line-height:1.6;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
img{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
svg{display:block}

.app{position:absolute;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;overflow:hidden;
  padding:env(safe-area-inset-top,0px) max(14px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}

/* status strip */
.bar{flex:none;display:flex;align-items:center;gap:6px;height:52px;min-width:0}
.brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1;font-family:var(--font-display);font-weight:500;font-size:15.5px}
.brand span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.led{flex:none;width:9px;height:9px;border-radius:50%;background:var(--muted);transition:background .3s,box-shadow .3s}
.app:not([data-state=sleep]):not([data-state=doze]) .led{background:var(--glow);box-shadow:0 0 10px var(--glow-shadow)}
.app[data-state=thinking] .led,.app[data-state=looking] .led,.app[data-state=searching] .led{animation:blinkled .9s ease-in-out infinite}
.app[data-state=error] .led{background:var(--warn);box-shadow:0 0 10px var(--warn-shadow)}
@keyframes blinkled{50%{opacity:.25}}
.status{flex:none;max-width:34%;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;padding:0}
.icon-btn svg{width:21px;height:21px}
.icon-btn[aria-pressed=true]{background:var(--glow);color:var(--on-glow);border-color:transparent}

/* stage: compact face */
.stage{flex:none;position:relative;height:calc(var(--face) + 26px);display:grid;place-items:center;overflow:hidden;contain:layout paint}
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(closest-side at 50% 50%,var(--glow-haze),var(--glow-haze-2) 62%,transparent)}
.halo{position:absolute;inset:0;pointer-events:none;--t:0}
.halo i{position:absolute;left:50%;top:50%;aspect-ratio:1;border-radius:50%;border:1px solid var(--ring);transform:translate(-50%,-50%) scale(calc(1 + var(--t) * .07));opacity:calc(.5 + var(--t) * .5)}
.halo i:nth-child(1){width:calc(var(--face) * 1.12)}
.halo i:nth-child(2){width:calc(var(--face) * 1.42);opacity:calc(.3 + var(--t) * .45)}
.halo i:nth-child(3){width:calc(var(--face) * 1.75);opacity:calc(.16 + var(--t) * .35)}
.app[data-mic=on] .halo i{animation:listen 1.3s ease-in-out infinite}
.app[data-mic=on] .halo i:nth-child(2){animation-delay:.18s}
.app[data-mic=on] .halo i:nth-child(3){animation-delay:.36s}
@keyframes listen{50%{scale:1.05;border-color:var(--glow-line)}}
.face{position:relative;z-index:1;height:var(--face);aspect-ratio:280/318;padding:0;border:0;background:none;border-radius:42%;touch-action:manipulation;
  transition:translate .45s cubic-bezier(.3,.7,.2,1),scale .45s cubic-bezier(.3,.7,.2,1)}
.app[data-cam=on] .face{translate:calc(var(--face) * .36) 0;scale:.88}
.face-in{position:absolute;inset:0;animation:float 7s ease-in-out infinite;transition:rotate .7s cubic-bezier(.3,.7,.2,1)}
.app[data-state=thinking] .face-in,.app[data-state=searching] .face-in,.app[data-state=looking] .face-in{rotate:-2.5deg}
.face-img{position:absolute;inset:0;width:100%;height:100%;max-width:100%;pointer-events:none;-webkit-user-drag:none;filter:drop-shadow(0 14px 22px var(--shade))}
.eyes{position:absolute;left:16.4286%;top:33.3333%;width:67.1429%;height:23.2704%;filter:drop-shadow(0 0 3px var(--glow-shadow))}
.app[data-state=error] .eyes{filter:drop-shadow(0 0 3px var(--warn-shadow))}
.overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.m-open{fill:var(--mouth)} .m-glow{fill:none;stroke:var(--glow);stroke-linecap:round} .m-core{fill:none;stroke:var(--glow-core);stroke-linecap:round}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.3%)}}
.cam{position:absolute;z-index:2;inset-inline-end:2px;top:8px;bottom:8px;aspect-ratio:3/4;max-width:46%;border-radius:16px;overflow:hidden;background:var(--panel);
  border:2px solid var(--glow-line);box-shadow:0 0 0 3px var(--glow-haze),0 10px 24px var(--shade)}
.cam video,.cam .still{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover}
.cam .scan{position:absolute;inset-inline:0;top:-34%;height:32%;background:linear-gradient(to bottom,transparent,var(--glow-line) 70%,transparent);opacity:0;pointer-events:none}
.app[data-state=looking] .cam .scan{opacity:1;animation:scan 1.1s linear infinite}
@keyframes scan{to{top:102%}}
.cam-btn{position:absolute;top:5px;z-index:1;width:32px;height:32px;border-radius:50%;border:0;background:var(--veil);color:var(--fg);display:grid;place-items:center;padding:0}
.cam-btn svg{width:17px;height:17px}
#camClose{inset-inline-start:5px} #camFlip{inset-inline-end:5px}
.wake-pill{position:absolute;z-index:2;bottom:4px;left:50%;translate:-50% 0;font-size:11.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap}
.app[data-state=doze] .wake-pill{color:var(--glow)}

/* chat */
.chat{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;display:flex;flex-direction:column;gap:10px;padding:10px 2px 8px;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 14px);mask-image:linear-gradient(to bottom,transparent,#000 14px);user-select:text;-webkit-user-select:text}
.chat>:first-child{margin-top:auto}
.msg{max-width:88%;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.user{align-self:flex-start;background:var(--user);border:1px solid var(--line);border-radius:18px 18px 4px 18px;padding:7px 12px;font-size:calc(14.5px * var(--fs))}
.msg.user .mic-ic{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-inline-end:4px;color:var(--glow)}
.msg.user img{display:block;width:120px;max-width:100%;border-radius:10px;margin-bottom:6px}
.msg.bot{align-self:stretch;max-width:100%;font-family:var(--font-display);font-size:calc(17px * var(--fs));line-height:1.75;padding-inline:4px}
.msg.bot:empty::before{content:"…";color:var(--muted)}
.hist{display:flex;flex-direction:column;gap:8px}
.hist .day{align-self:center;font-size:11.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 12px;margin:6px 0 2px}
.hmsg{max-width:86%;padding:7px 12px;font-size:calc(13.5px * var(--fs));line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.hmsg.u{align-self:flex-start;background:var(--user);border:1px solid var(--line);border-radius:16px 16px 4px 16px}
.hmsg.b{align-self:flex-end;background:var(--raised);border-radius:16px 16px 16px 4px}
.choices{align-self:stretch;display:flex;flex-wrap:wrap;gap:7px}
.choices .chip.on{background:var(--glow);color:var(--on-glow);border-color:transparent}
.choices .chip:disabled:not(.on){opacity:.45}
.remote{display:flex;flex-wrap:wrap;gap:7px}
.remote button{flex:1 0 46px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--raised);color:var(--fg);font-size:16px;font-weight:600;padding:0}
.remote button.pw{color:var(--warn)}
.wx{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.wx b{font-family:var(--font-display);font-size:28px;font-weight:600;color:var(--fg)}
.wx b small{font-size:15px;color:var(--muted);font-weight:500}
.wx span{color:var(--muted);font-size:13px}
.msg.note{align-self:center;max-width:94%;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.6}
.msg.err{align-self:stretch;color:var(--warn);font-size:13.5px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.msg.err small{flex-basis:100%;color:var(--muted);font-size:11.5px;direction:ltr;text-align:right}
.pill-btn{border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:5px 13px;font-size:12.5px;color:var(--fg)}
.msg.err .pill-btn{border-color:var(--warn-line);color:var(--warn);background:transparent}
.card{align-self:stretch;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 12px;display:grid;gap:8px;font-size:13px}
.card-h{display:flex;align-items:center;gap:8px;color:var(--muted);min-width:0}
.card-h svg{flex:none;width:17px;height:17px;color:var(--glow)}
.card-h b{color:var(--fg);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.card-h .spin{margin-inline-start:auto;width:14px;height:14px;border-radius:50%;border:2px solid var(--glow-line);border-top-color:transparent;animation:spin 0.8s linear infinite;flex:none}
.card-h .ok{margin-inline-start:auto;color:var(--glow);font-size:12px;flex:none}
@keyframes spin{to{rotate:360deg}}
.srcs{display:grid;gap:6px}
.src{display:flex;gap:9px;align-items:center;border:0;background:var(--raised);border-radius:10px;padding:7px 9px;text-align:start;min-width:0;width:100%}
.src i{flex:none;width:24px;height:24px;border-radius:7px;background:var(--glow-soft);color:var(--glow);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:600}
.src span{min-width:0;display:grid}
.src b{font-weight:500;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src small{color:var(--muted);font-size:11px;direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.media{display:flex;gap:10px;align-items:center;min-width:0}
.media img{flex:none;width:92px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:var(--raised)}
.media div{min-width:0;display:grid;gap:2px}
.media b{font-size:13px;font-weight:500;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.media small{color:var(--muted);font-size:11.5px}

/* chips + ask bar */
.chips{flex:none;display:flex;flex-wrap:wrap;align-content:flex-start;gap:0 7px;height:34px;margin-block:6px;overflow:hidden;transition:opacity .25s}
.chips.dim{opacity:.35;pointer-events:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;height:34px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:0 13px;font-size:13px;font-weight:500;line-height:1.2;white-space:nowrap}
.chip svg{width:16px;height:16px;color:var(--glow)}
.composer{flex:none;display:flex;align-items:center;gap:6px;padding:5px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.composer:focus-within{border-color:var(--glow-line)}
.composer .icon-btn{border:0;background:var(--raised)}
.composer input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:400 16px/1.4 var(--font-body);padding:9px 4px;outline:none;user-select:text;-webkit-user-select:text}
.composer input::placeholder{color:var(--muted)}
.act{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--glow);color:var(--on-glow);display:grid;place-items:center;padding:0;transition:background .2s,opacity .2s}
.act svg{width:22px;height:22px}
.act[data-mode=stop]{background:var(--raised);color:var(--fg)}
.act[data-mode=listen-stop]{animation:micpulse 1.2s ease-out infinite}
@keyframes micpulse{0%{box-shadow:0 0 0 0 var(--glow-line)}100%{box-shadow:0 0 0 14px transparent}}
.act:disabled{opacity:.35}
.hint{flex:none;margin:6px 0 0;display:flex;justify-content:center;align-items:center;gap:6px;color:var(--muted);font-size:12px;line-height:1.45;text-align:center;min-height:18px}
.hint svg{flex:none;width:14px;height:14px;color:var(--glow)}
.hint.tip{color:var(--warn)} .hint.tip svg{color:var(--warn)}

/* settings: full screens */
.screen{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;max-width:560px;margin:0 auto;
  padding:env(safe-area-inset-top,0px) max(14px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(14px,env(safe-area-inset-left,0px));
  animation:slidein .22s ease-out}
@keyframes slidein{from{transform:translateX(-14%);opacity:.4}}
.screen-h{flex:none;display:flex;align-items:center;gap:10px;height:56px}
.screen-h h2{margin:0;font-family:var(--font-display);font-size:19px;font-weight:600}
.screen-b{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;padding-bottom:28px}
.screen-b>*+*{margin-top:14px}
.screen-b>.group-t+.group{margin-top:8px}
.group{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.group-t{margin:0;padding:6px 4px 0;font-size:12.5px;color:var(--muted);font-weight:500}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px;border:0;background:none;width:100%;text-align:start;color:var(--fg)}
.row+.row{border-top:1px solid var(--line)}
.row .ic{flex:none;width:36px;height:36px;border-radius:11px;background:var(--raised);display:grid;place-items:center;color:var(--glow)}
.row .ic svg{width:19px;height:19px}
.row .tx{flex:1;min-width:0;display:grid;gap:1px}
.row .tx b{font-weight:500;font-size:14.5px}
.row .tx small{color:var(--muted);font-size:12px;line-height:1.45}
.row .chev{flex:none;color:var(--muted)} .row .chev svg{width:18px;height:18px}
.row .val{flex:none;color:var(--muted);font-size:12.5px}
.row.col{flex-wrap:wrap;row-gap:10px}
.row.col>.seg,.row.col>.field,.row.col>.swatches,.row.col>input[type=range]{flex:1 0 100%}
.tag{flex:none;font-size:11.5px;border-radius:999px;padding:2px 9px;background:var(--raised);color:var(--muted)}
.tag.on{background:var(--glow-soft);color:var(--glow)}
.switch{flex:none;position:relative;width:46px;height:28px;border-radius:999px;border:0;background:var(--raised);padding:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:inset-inline-start .2s,background .2s}
.switch[aria-checked=true]{background:var(--glow-soft)}
.switch[aria-checked=true]::after{inset-inline-start:21px;background:var(--glow)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:6px 12px;font-size:12.5px}
.seg button[aria-pressed=true]{background:var(--glow);color:var(--on-glow);border-color:transparent;font-weight:600}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:2px solid transparent;padding:0}
.swatches button[aria-pressed=true]{border-color:var(--fg)}
.field{display:flex;gap:8px}
.field .btn:disabled{opacity:.4}
.row.col>.field>.btn:only-child{flex:1}
.tx b .tag{display:inline-block;margin-inline-start:8px;vertical-align:2px;font-weight:500}
.field input,.field select{flex:1;min-width:0;height:42px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:0 12px;font:500 14.5px var(--font-body);user-select:text;-webkit-user-select:text}
input[type=range]{width:100%;accent-color:var(--glow)}
.btn{flex:none;height:42px;border-radius:11px;border:1px solid var(--line);background:var(--raised);padding:0 14px;font-size:13.5px;font-weight:500}
.btn.primary{background:var(--glow);color:var(--on-glow);border-color:transparent}
.note-box{font-size:12.5px;color:var(--muted);line-height:1.7;padding:2px 4px}
.dev{display:grid;gap:6px;padding:16px;text-align:center}
.dev .who{font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--glow)}
.dev p{margin:0;color:var(--muted);font-size:13px;line-height:1.7}

@media (prefers-reduced-motion:reduce){.face-in{animation:none}.app[data-mic=on] .halo i,.act[data-mode=listen-stop]{animation:none}.screen{animation:none}}
:root[data-motion=off] .face-in,:root[data-motion=off] .halo i{animation:none!important}
</style>
</head>
<body>
<div class="app" id="app" data-state="sleep" data-cam="off" data-mic="off">
  <header class="bar">
    <button class="icon-btn" id="histBtn" type="button" aria-label="المحادثات السابقة"></button>
    <div class="brand"><span class="led" aria-hidden="true"></span><span id="robotName">الروبوت المتكلّم</span></div>
    <div class="status" id="status" role="status"></div>
    <button class="icon-btn" id="wakeBtn" type="button" aria-pressed="false" aria-label="الاستماع لكلمة التنبيه"></button>
    <button class="icon-btn" id="setBtn" type="button" aria-label="الإعدادات"></button>
  </header>

  <section class="stage" id="stage">
    <div class="halo" id="halo" aria-hidden="true"><i></i><i></i><i></i></div>

function sourceList(items) {

/** full browser search: engines + reading the best pages (+ Plan 2 when thin). Returns text for the AI. */
async function webSearch(query, early) {
  query = clip(query, 200);
  const c = card("globe", "المتصفح يبحث: «" + query + "»");
  setState("searching");
  let results = early ? await early : [];
  if (!results.length) results = await engines(query);
  if (cancelled()) throw { code: "cancelled" };
  let pages = [];
  if (results.length) {
    c.title("يقرأ أفضل النتائج: «" + query + "»");
    const reads = results.slice(0, 3).map((r) => readPage(r.url).catch(() => ""));
    pages = await withTimeout(Promise.all(reads), 3800) || await Promise.all(reads.map((p) => withTimeout(p, 10).then((x) => x || "")));
  }
  if (cancelled()) throw { code: "cancelled" };
  const got = results.reduce((n, r) => n + (r.snippet || "").length, 0) + pages.reduce((n, p) => n + (p || "").length, 0);
  let g = null;
  if (results.length < 2 || got < 300) {
    c.title("يبحث بعمق: «" + query + "»");
    try { g = await searchGrounded(query); } catch (e) { if (cancelled()) throw { code: "cancelled" }; }
  }
  if (!results.length && !(g && g.text)) { c.fail("لا نتائج"); return null; }
  const shown = results.slice(0, 4).map((r) => ({ title: r.title, url: r.url }));
  if (g) for (const x of g.sources.slice(0, Math.max(1, 4 - shown.length))) shown.push({ title: x.title, url: x.url, domain: x.title });
  c.title("بحث المتصفح: «" + query + "»");
  c.add(sourceList(shown));
  c.done(shown.length + " مصادر");
  const lines = ["Web results for «" + query + "» (searched " + new Date().toISOString().slice(0, 16).replace("T", " ") + "):"];
  results.slice(0, 5).forEach((r, k) => {
    lines.push(`${k + 1}. ${r.title} (${host(r.url)}): ${r.snippet || ""}`);
    if (k < 3 && pages[k]) lines.push("   Page text: " + pages[k]);
  });
  if (g && g.text) lines.push("Search summary: " + g.text);
  return lines.join("\n");
}

/* ---------------- weather (free Open-Meteo service, no key) ---------------- */
const WMO = { 0: "صافٍ", 1: "صافٍ غالباً", 2: "غائم جزئياً", 3: "غائم", 45: "ضباب", 48: "ضباب", 51: "رذاذ خفيف", 53: "رذاذ", 55: "رذاذ كثيف",
  61: "مطر خفيف", 63: "مطر", 65: "مطر غزير", 66: "مطر متجمد", 67: "مطر متجمد", 71: "ثلج خفيف", 73: "ثلج", 75: "ثلج كثيف", 77: "ثلج",
  80: "زخات مطر", 81: "زخات مطر", 82: "زخات مطر غزيرة", 85: "زخات ثلج", 86: "زخات ثلج", 95: "عاصفة رعدية", 96: "عاصفة رعدية وبَرَد", 99: "عاصفة رعدية وبَرَد" };
async function geocode(place) {
  const tries = [];
  const words = place.trim().split(/\s+/).filter(Boolean);
  const variants = (w) => {
    const v = [w];
    if (/ه$/.test(w)) v.push(w.replace(/ه$/, "ة"));
    if (/^[بلو]/.test(w) && w.length > 4) v.push(w.slice(1), w.slice(1).replace(/ه$/, "ة"));
    if (!/^ال/.test(w)) v.push("ال" + w); else v.push(w.slice(2));
    return v;
  };
  const push = (x) => { if (x && !tries.includes(x)) tries.push(x); };
  push(words.join(" "));
  if (words.length > 1) { push(words.slice(-2).join(" ")); push(words.slice(0, 2).join(" ")); }
  for (const w of words.slice().reverse()) for (const v of variants(w)) if (v.length > 2) push(v);
  for (const name of tries.slice(0, 6)) {
    try {
      const j = JSON.parse(await fetchText("https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(name) + "&count=5&language=ar&format=json", 5000));
      const list = j.results || [];
      const pick = list.find((r) => r.country_code === "IQ") || list[0];
      if (pick) return { name: pick.name || name, lat: pick.latitude, lon: pick.longitude };
    } catch (e) { if (cancelled()) throw { code: "cancelled" }; }
  }
  return null;
}
async function weatherAnswer(place, day, askedRain) {
  const c = card("globe", "الطقس: " + place);
  setState("searching");
  const g = await geocode(place);
  if (!g) { c.fail("ما لقيت المكان"); return { text: "ما لقيت مكاناً اسمه «" + place + "». قل اسم المدينة بشكل أوضح." }; }
  let j;
  try {
    j = JSON.parse(await fetchText(`https://api.open-meteo.com/v1/forecast?latitude=${g.lat}&longitude=${g.lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum&timezone=auto&forecast_days=3`, 6000));
  } catch (e) { if (cancelled()) throw { code: "cancelled" }; c.fail(); return null; }
  const d = j.daily || {}, cur = j.current || {};
  const i = Math.min(day, (d.time || [1]).length - 1);
  const max = Math.round(d.temperature_2m_max[i]), min = Math.round(d.temperature_2m_min[i]);
  const rain = d.precipitation_probability_max ? Math.round(d.precipitation_probability_max[i] || 0) : 0;
  const desc = WMO[i === 0 && cur.weather_code !== undefined ? cur.weather_code : d.weather_code[i]] || "";
  const dayWord = ["اليوم", "باچر", "بعد باچر"][i];
  let text = i === 0 && cur.temperature_2m !== undefined
    ? `في ${g.name} الآن ${desc}، والحرارة ${Math.round(cur.temperature_2m)} درجة. العظمى اليوم ${max} والصغرى ${min}، واحتمال المطر ${rain} بالمية.`
    : `في ${g.name} ${dayWord}: ${desc}، العظمى ${max} والصغرى ${min}، واحتمال المطر ${rain} بالمية.`;
  if (askedRain) text += rain >= 60 ? " يعني على الأغلب راح تمطر." : rain >= 30 ? " ممكن تمطر شوية." : " ما أتوقع تمطر.";
  const row = document.createElement("div");
  row.className = "wx";
  row.innerHTML = `<b>${max}°<small> / ${min}°</small></b><span></span>`;
  row.querySelector("span").textContent = `${desc} · مطر ${rain}٪${cur.wind_speed_10m !== undefined && i === 0 ? " · رياح " + Math.round(cur.wind_speed_10m) + " كم/س" : ""}`;
  c.title(`الطقس في ${g.name} · ${dayWord}`); c.add(row); c.done("✓");
  if (S.city !== g.name && !S.cityAsked) { S.city = S.city || g.name; saveSettings(); }
  return { text };
}

let installed = null;   // [{label, pkg, n}]
function loadApps(force) {

let contactsCache = null;
async function waitPerm(p, ms) { const t0 = Date.now(); while (Date.now() - t0 < ms) { if (N("perm", p) === 0) return true; await sleep(400); if (cancelled()) return false; } return false; }
async function ensurePerms(list, why) {

  if (!need.length) return true;
  addNote(why);
  N("askPerm", need.join(","));
  return waitPerm(need[0], 25000);
}
async function getContacts() {
  if (!AB) return [];
  if (!(await ensurePerms(["android.permission.READ_CONTACTS", "android.permission.CALL_PHONE"], "اسمح للروبوت بقراءة الأسماء وإجراء المكالمات حتى يتصل بدلاً عنك."))) return null;
  if (!contactsCache) {
    contactsCache = [];
    try { const a = JSON.parse(N("contacts") || "[]"); for (let i = 0; i + 1 < a.length; i += 2) if (a[i + 1]) contactsCache.push({ name: String(a[i] || ""), num: String(a[i + 1]), n: normAr(a[i] || "") }); } catch (e) {}
  }
  return contactsCache;
}
const KIN = [
  [/^(امي|ماما|يمه|يما|الوالده|والدتي|امي الغاليه|الحجيه|ام)$/, /(امي|ماما|يمه|يما|الوالده|والدتي|الحجيه|mom|mother|mama|maman)/],
  [/^(ابوي|ابي|بابا|يابه|الوالد|والدي|الحجي|ابويه)$/, /(ابوي|ابي|بابا|يابه|الوالد|والدي|الحجي|dad|father|baba)/],
  [/^(زوجتي|مرتي|حرمي|زوجتي العزيزه)$/, /(زوجتي|مرتي|حرمي|حبيبتي|عمري|حياتي|wife)/],
  [/^(زوجي|رجلي)$/, /(زوجي|رجلي|حبيبي|عمري|حياتي|husband)/],
];
function lev(a, b) {
  const m = a.length, n = b.length, d = Array.from({ length: m + 1 }, (_, i) => [i]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[m][n];
}
function matchContacts(spoken, list) {
  const q = normAr(spoken).replace(/^(ال|ب|ل)(?=\S{3})/, (x) => (x === "ال" ? "ال" : "")).trim();
  const kin = KIN.find(([who]) => who.test(q));
  const scored = [];
  for (const c of list) {
    let s = 0;
    if (kin && kin[1].test(c.n)) s = 95;
    else if (c.n === q) s = 100;
    else if (c.n.startsWith(q + " ")) s = 90;                 // first name
    else if (c.n.endsWith(" " + q)) s = 70;                   // only the family name: ask first
    else if (q.length > 2 && c.n.includes(q)) s = 65;
    else {
      const qt = q.split(" "), ct = c.n.split(" ");
      const common = qt.filter((w) => w.length > 1 && ct.some((x) => x === w || (w.length > 3 && x.length > 3 && (x.startsWith(w) || w.startsWith(x))))).length;
      if (common) s = 55 + 10 * common;
      else if (q.length > 3) { const dd = lev(q, c.n); if (dd <= Math.max(1, Math.floor(q.length / 4))) s = 60 - dd; }
    }
    if (s) scored.push({ c, s });
  }
  scored.sort((a, b) => b.s - a.s);
  const seen = new Set(), out = [];
  for (const x of scored) { const k = x.c.n; if (seen.has(k)) continue; seen.add(k); out.push(x); }
  return out;
}
async function callSomeone(who) {
  if (!AB) return { text: "الاتصال يعمل داخل تطبيق الأندرويد فقط." };
  const list = await getContacts();
  if (list === null) return { text: "لازم تسمح بإذن الأسماء والمكالمات حتى أگدر أتصل." };
  const digits = who.replace(/[^\d+]/g, "");
  if (digits.length >= 6) return dial(digits, digits);
  const found = matchContacts(who, list);
  if (!found.length || found[0].s < 55) return { text: "ما لقيت «" + who + "» بين الأسماء في موبايلك." };
  const sure = found[0].s >= 90 && (found.length === 1 || found[1].s < found[0].s - 10);
  if (sure) return dial(found[0].c.num, found[0].c.name);
  const opts = found.slice(0, 3).map((x) => x.c);   // never guess who to call: ask
  pending = { type: "choose-contact", opts };
  choiceButtons(opts.map((c) => c.name).concat(["لا، ولا واحد"]), (i) => ask(i < opts.length ? opts[i].name : "لا", { fromChoice: true }));
  return { text: opts.length > 1 ? "تقصد " + opts.map((c) => c.name).join(" لو ") + "؟" : "تقصد " + opts[0].name + "؟", expectReply: true };
}
async function dial(num, name) {
  await ensurePerms(["android.permission.CALL_PHONE"], "اسمح للروبوت بإجراء المكالمات.");
  const r = N("call", "tel:" + encodeURIComponent(num));
  const c = card("phone", "اتصال: " + name);
  if (r === 2) { c.done("يتصل"); return { text: "جاري الاتصال بـ" + name + ".", silent: true }; }
  if (r === 1) { c.done("الطالب"); return { text: "فتحت لك رقم " + name + "، اضغط زر الاتصال." }; }
  c.fail(); return { text: "ما گدرت أتصل الآن." };
}
async function hangUp(answer) {
  if (!AB) return { text: "هذا يعمل داخل تطبيق الأندرويد فقط." };
  await ensurePerms(["android.permission.ANSWER_PHONE_CALLS"], "اسمح للروبوت بالتحكم بالمكالمات حتى يقطعها أو يرد عليها.");

/* ---------------- lifecycle: background, battery, launch from the assistant button ---------------- */
let hiddenAt = 0, battery = null, autoSleepTimer = 0;

  battery = b;
  const check = () => {
    if (document.hidden && batteryLow() && S.handsFree) { sleepingForBattery = true; if (Ears.mode === "wake") Ears.pause(); }
    else if (sleepingForBattery && !batteryLow()) { sleepingForBattery = false; Ears.resume(); }

}).catch(() => {});
